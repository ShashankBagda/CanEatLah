<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Menu | CanEatLah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/visuals.css" />
  <link rel="stylesheet" href="../assets/css/experience.css" />
  <link rel="stylesheet" href="../assets/css/portal.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html"><span class="brand-dot"></span><span>CanEatLah</span></a>
      <nav class="header-nav">
        <span class="status soft">Owner: <span id="ownerName">-</span></span>
        <button id="signOutBtn" class="btn btn-secondary">Sign Out</button>
      </nav>
    </div>
  </header>

  <main class="portal-shell">
    <section class="container">
      <div class="portal-top">
        <div><h1>Menu Management</h1><p>Restaurant: <strong id="restaurantName">-</strong></p></div>
      </div>

      <nav class="portal-nav">
        <a href="restaurant-dashboard.html">Dashboard</a>
        <a class="active" href="restaurant-menu.html">Menu</a>
        <a href="restaurant-orders.html">Orders</a>
        <a href="restaurant-reservations.html">Reservations</a>
      </nav>

      <section class="two-col">
        <article class="card panel">
          <h2>Add / Edit Menu Item</h2>
          <form id="menuForm" class="form-grid" novalidate>
            <input id="itemId" name="itemId" type="hidden" />
            <div class="inline-two">
              <div class="field"><label for="name">Item Name</label><input id="name" name="name" type="text" required /></div>
              <div class="field"><label for="price">Price</label><input id="price" name="price" type="number" step="0.01" min="0" required /></div>
            </div>
            <div class="field"><label for="ingredients">Detailed Ingredients</label><textarea id="ingredients" name="ingredients" rows="3" placeholder="e.g. wheat flour, peanut oil, paneer"></textarea></div>
            <div class="field"><label for="quantityInfo">Ingredient Quantity Notes</label><input id="quantityInfo" name="quantityInfo" type="text" placeholder="e.g. Peanut oil 10ml, Paneer 80g" /></div>
            <div class="inline-two">
              <div class="field"><label for="dishTags">Dish Tags (comma separated)</label><input id="dishTags" name="dishTags" type="text" placeholder="vegan, spicy, high-protein" /></div>
              <div class="field"><label for="allergyTags">Allergy Tags (comma separated)</label><input id="allergyTags" name="allergyTags" type="text" placeholder="peanut, gluten, dairy" /></div>
            </div>
            <div class="field">
              <label for="availability">Availability</label>
              <select id="availability" name="availability">
                <option value="available">Available</option>
                <option value="unavailable">Unavailable</option>
              </select>
            </div>
            <div class="form-actions inline-actions">
              <button type="submit" class="btn btn-primary">Save Item</button>
              <button type="button" id="menuResetBtn" class="btn btn-secondary">Clear</button>
            </div>
            <div id="menuMessage" class="form-message" aria-live="polite"></div>
          </form>
        </article>

        <article class="card panel">
          <h2>Menu List</h2>
          <div id="menuTable"></div>
        </article>
      </section>
    </section>
  </main>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/experience.js"></script>
  <script src="../assets/js/restaurant.js"></script>
  <script>
    if (window.appAuth.requireRole("restaurant")) {
      window.restaurantPortal.initMenu();
    }
  </script>
</body>
</html>
