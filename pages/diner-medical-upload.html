<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Reports | CanEatLah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/visuals.css" />
  <link rel="stylesheet" href="../assets/css/experience.css" />
  <link rel="stylesheet" href="../assets/css/portal.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html"><span class="brand-dot"></span><span>CanEatLah</span></a>
      <nav class="header-nav">
        <span class="status soft">Diner: <span id="dinerName">-</span></span>
        <button id="signOutBtn" class="btn btn-secondary">Sign Out</button>
      </nav>
    </div>
  </header>

  <main class="portal-shell">
    <section class="container">
      <div class="portal-top">
        <div><h1>Medical Report Upload</h1><p>Upload reports to support allergy verification.</p></div>
      </div>

      <nav class="portal-nav">
        <a href="diner-dashboard.html">Dashboard</a>
        <a href="diner-survey.html">Survey</a>
        <a class="active" href="diner-medical-upload.html">Medical Reports</a>
        <a href="diner-restaurants.html">Restaurants</a>
        <a href="diner-ai-recommendations.html">AI Recommendations</a>
        <a href="diner-groups.html">Groups</a>
        <a href="diner-order-history.html">Order History</a>
        <a href="diner-profile.html">Profile</a>
      </nav>

      <article class="card panel">
        <form id="reportForm" class="form-grid" novalidate>
          <div class="inline-two">
            <div class="field">
              <label for="reportFile">Attach Report File</label>
              <input id="reportFile" name="reportFile" type="file" accept=".pdf,.jpg,.jpeg,.png" />
            </div>
            <div class="field">
              <label for="reportName">Or Enter Report Name</label>
              <input id="reportName" name="reportName" type="text" placeholder="Allergy_test_2026.pdf" />
            </div>
          </div>

          <div class="field">
            <label for="extractedAllergies">Detected/Expected Allergies (comma separated)</label>
            <input id="extractedAllergies" name="extractedAllergies" type="text" placeholder="peanut, shellfish" />
          </div>

          <div class="field">
            <label for="notes">Notes for Admin</label>
            <textarea id="notes" name="notes" rows="3" placeholder="Any notes for verification"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Upload Report</button>
          </div>
          <div id="reportMessage" class="form-message" aria-live="polite"></div>
        </form>
      </article>

      <article class="card panel" style="margin-top: 0.9rem;">
        <h2>Uploaded Reports</h2>
        <div id="reportList"></div>
      </article>
    </section>
  </main>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/experience.js"></script>
  <script src="../assets/js/recommendation.js"></script>
  <script src="../assets/js/diner.js"></script>
  <script>
    if (window.appAuth.requireRole("diner")) {
      window.dinerPortal.initMedicalUpload();
    }
  </script>
</body>
</html>
