<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Orders | CanEatLah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/visuals.css" />
  <link rel="stylesheet" href="../assets/css/experience.css" />

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html"><span class="brand-dot"></span><span>CanEatLah</span></a>
      <nav class="header-nav">
        <span class="status soft">Owner: <span id="ownerName">-</span></span>
        <button id="signOutBtn" class="btn btn-secondary">Sign Out</button>
      </nav>
    </div>
  </header>

  <main class="portal-shell">
    <section class="container">
      <div class="portal-top">
        <div><h1>Order Inbox</h1><p>Restaurant: <strong id="restaurantName">-</strong></p></div>
      </div>

      <nav class="portal-nav">
        <a href="restaurant-dashboard.html">Dashboard</a>

        <a href="restaurant-reservations.html">Reservations</a>

        <h2>Incoming Orders</h2>
        <div id="ordersTable"></div>
      </article>
    </section>
  </main>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/experience.js"></script>
  <script src="../assets/js/restaurant.js"></script>
  <script>
    if (window.appAuth.requireRole("restaurant")) {
      window.restaurantPortal.initOrders();
    }
  </script>
